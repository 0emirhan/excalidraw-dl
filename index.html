<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excalidraw DL</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #6e40c9;
      --accent-hover: #8957e5;
      --green: #3fb950;
      --red: #f85149;
      --code-bg: #1f2428;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header h1 span { color: var(--accent-hover); }

    header p {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      width: 100%;
      max-width: 600px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
      font-size: 0.85rem;
      padding: 12px;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s;
      line-height: 1.6;
    }

    textarea:focus { border-color: var(--accent); }

    textarea::placeholder { color: var(--muted); }

    .btn {
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:active:not(:disabled) { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Log */
    #log {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.88rem;
      padding: 10px 12px;
      border-radius: 6px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      word-break: break-all;
    }

    .log-item.loading { border-color: var(--accent); }
    .log-item.success { border-color: var(--green); }
    .log-item.error   { border-color: var(--red); }

    .icon {
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .log-detail { color: var(--muted); font-size: 0.8rem; margin-top: 3px; }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
    }

    footer a { color: var(--accent-hover); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent-hover);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      margin-top: 2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>Excalidraw <span>DL</span></h1>
    <p>Paste one or more read-only Excalidraw links — one per line.</p>
  </header>

  <div class="card">
    <textarea id="input" placeholder="https://link.excalidraw.com/p/readonly/XXXXXX
https://link.excalidraw.com/p/readonly/YYYYYY
https://link.excalidraw.com/p/readonly/ZZZZZZ"></textarea>
    <button class="btn" id="btn" onclick="run()">Download</button>
    <div id="log"></div>
  </div>

  <footer>
    <a href="https://github.com/0emirhan/excalidraw-dl">GitHub</a>
    &nbsp;·&nbsp;
    No data is stored. Files download directly to your browser.
  </footer>

  <script>
    // Proxies tentés dans l'ordre — le premier qui répond avec les données gagne
    const PROXIES = [
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://thingproxy.freeboard.io/fetch/${url}`,
    ];

    async function fetchWithProxy(targetUrl) {
      for (const makeProxy of PROXIES) {
        try {
          const res = await fetch(makeProxy(targetUrl), { signal: AbortSignal.timeout(12000) });
          if (!res.ok) continue;
          const html = await res.text();
          if (html.includes('"sceneContents":')) return html;
        } catch (_) { /* essaie le suivant */ }
      }
      throw new Error('All proxies failed — use the Python CLI instead');
    }

    function parseScene(html) {
      const idx = html.indexOf('"sceneContents":');
      if (idx === -1) throw new Error('No scene data found in page');
      const raw = html.slice(idx + 16);
      const unesc = raw.replace(/\\"/g, '"').replace(/\\\\/g, '\\').replace(/\\\//g, '/');
      let depth = 0, end = 0;
      for (let i = 0; i < unesc.length; i++) {
        if (unesc[i] === '{') depth++;
        else if (unesc[i] === '}') { depth--; if (depth === 0) { end = i + 1; break; } }
      }
      if (!end) throw new Error('Could not extract scene JSON');
      const json = unesc.slice(0, end);
      JSON.parse(json); // validate
      return json;
    }

    function safeFilename(title) {
      return (title || 'excalidraw-export')
        .replace(/ - Excalidraw\+$/, '').trim()
        .replace(/[\/\\:*?"<>|]/g, '_') || 'excalidraw-export';
    }

    function download(json, filename) {
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename + '.excalidraw';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
    }

    function addLog(url, state, detail = '') {
      const id = 'log-' + url.slice(-20).replace(/\W/g, '');
      const existing = document.getElementById(id);
      const html = renderLog(url, state, detail);
      if (existing) { existing.className = 'log-item ' + state; existing.innerHTML = html; return; }
      const div = document.createElement('div');
      div.id = id; div.className = 'log-item ' + state; div.innerHTML = html;
      document.getElementById('log').appendChild(div);
    }

    function renderLog(url, state, detail) {
      const icons = { loading: '<div class="spinner"></div>', success: '<span class="icon">✓</span>', error: '<span class="icon" style="color:var(--red)">✗</span>' };
      const shortUrl = url.replace('https://link.excalidraw.com/p/readonly/', '…/');
      return `${icons[state]}<div><div>${shortUrl}</div>${detail ? `<div class="log-detail">${detail}</div>` : ''}</div>`;
    }

    async function processUrl(url) {
      url = url.trim();
      if (!url) return;
      if (!url.startsWith('https://link.excalidraw.com/p/readonly/')) {
        addLog(url, 'error', 'Not a valid Excalidraw+ read-only link');
        return;
      }
      addLog(url, 'loading', 'Fetching…');
      try {
        const html = await fetchWithProxy(url);
        const json = parseScene(html);
        const parsed = JSON.parse(json);
        const titleMatch = html.match(/<title>([^<]+)<\/title>/);
        const title = titleMatch ? safeFilename(titleMatch[1]) : 'excalidraw-export';
        download(json, title);
        addLog(url, 'success', `${parsed.elements.length} elements — ${title}.excalidraw`);
      } catch (e) {
        const id = e.message.includes('proxies failed') ? e.message : e.message;
        addLog(url, 'error', `${id} — <a href="https://github.com/0emirhan/excalidraw-dl#cli" target="_blank" style="color:var(--accent-hover)">use Python CLI</a>`);
      }
    }

    async function run() {
      const urls = document.getElementById('input').value.split('\n').filter(u => u.trim());
      if (!urls.length) return;
      const btn = document.getElementById('btn');
      document.getElementById('log').innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Downloading…';
      await Promise.all(urls.map(processUrl));
      btn.disabled = false;
      btn.textContent = 'Download';
    }

    // Allow Enter key to not submit, Ctrl+Enter to run
    document.getElementById('input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
    });
  </script>

</body>
</html>
